- defaults:
    link:
      relink: true
      create: true
- clean: ['~']
- shell:
    - [git submodule update --init --recursive, Installing submodules]
- link:
    ~/.editorconfig:
    ~/.tmux.conf:
    ~/.vim/autoload/plug.vim: vim-plug/plug.vim
    ~/.vimrc:
    ~/.bashrc:
    ~/.bash_prompt:
    ~/.ctags:
    ~/.dircolors:
    ~/.gitconfig:
    ~/.gitignore:
    ~/.inputrc:
    ~/.zshrc:
    ~/.aliases: aliases
    ~/.zsh_plugins.txt: zsh/zsh_plugins.txt
    ~/.config/starship.toml: config/starship.toml
    ~/.Xresources:
    ~/.config/nvim: nvim
